<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ابن العرب AI - المنصة الشاملة</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>

    <style>
        :root {
            --bg-main: #060913;
            --card-bg: rgba(18, 24, 38, 0.7);
            --primary-glow: #38bdf8;
            --secondary-glow: #818cf8;
            --accent-pink: #f43f5e;
            --text-white: #f8fafc;
            --text-dim: #94a3b8;
            --border-glow: rgba(56, 189, 248, 0.2);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-white);
            min-height: 100vh;
            background-image: 
                radial-gradient(circle at 10% 10%, rgba(56, 189, 248, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 90% 90%, rgba(129, 140, 248, 0.08) 0%, transparent 40%);
            direction: rtl;
            overflow-x: hidden;
        }

        /* Navbar */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 8%;
            background: rgba(6, 9, 19, 0.8);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-glow);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 1.6rem;
            font-weight: 900;
            background: linear-gradient(135deg, var(--primary-glow), var(--secondary-glow));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .nav-actions {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .credits-pill {
            background: rgba(56, 189, 248, 0.1);
            border: 1px solid var(--primary-glow);
            color: var(--primary-glow);
            padding: 6px 16px;
            border-radius: 30px;
            font-weight: 700;
            font-size: 0.85rem;
        }

        .btn-google {
            background: #ffffff;
            color: #0f172a;
            border: none;
            padding: 10px 20px;
            border-radius: 10px;
            font-weight: 800;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(255,255,255,0.1);
        }

        .btn-google:hover { transform: translateY(-2px); }

        .user-profile {
            display: none;
            align-items: center;
            gap: 10px;
        }

        .user-profile img {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 2px solid var(--primary-glow);
        }

        /* Hero Section */
        .hero {
            text-align: center;
            padding: 60px 20px 40px;
            max-width: 900px;
            margin: 0 auto;
        }

        .hero h1 {
            font-size: 2.8rem;
            font-weight: 900;
            line-height: 1.2;
            margin-bottom: 15px;
        }

        .hero h1 span {
            background: linear-gradient(90deg, var(--primary-glow), var(--accent-pink));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero p {
            color: var(--text-dim);
            font-size: 1.1rem;
        }

        /* Tools Tabs Grid */
        .container {
            max-width: 1100px;
            margin: 0 auto 60px;
            padding: 0 20px;
        }

        .tools-nav {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .tab-btn {
            background: var(--card-bg);
            border: 1px solid var(--border-glow);
            color: var(--text-dim);
            padding: 12px 24px;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .tab-btn:hover, .tab-btn.active {
            background: linear-gradient(135deg, rgba(56, 189, 248, 0.2), rgba(129, 140, 248, 0.2));
            color: var(--text-white);
            border-color: var(--primary-glow);
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.15);
        }

        /* Active Tool Workspace */
        .workspace {
            background: var(--card-bg);
            border: 1px solid var(--border-glow);
            border-radius: 20px;
            padding: 30px;
            backdrop-filter: blur(16px);
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        }

        textarea {
            width: 100%;
            height: 120px;
            background: rgba(6, 9, 19, 0.7);
            border: 1px solid var(--border-glow);
            color: var(--text-white);
            padding: 15px;
            border-radius: 12px;
            font-size: 1rem;
            resize: none;
            outline: none;
            margin-bottom: 20px;
            transition: border 0.3s;
        }

        textarea:focus { border-color: var(--primary-glow); }

        .btn-generate {
            background: linear-gradient(90deg, var(--primary-glow), var(--secondary-glow));
            color: #000;
            border: none;
            width: 100%;
            padding: 15px;
            border-radius: 12px;
            font-weight: 900;
            font-size: 1.1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.3s;
        }

        .btn-generate:hover {
            transform: scale(1.01);
            box-shadow: 0 0 25px rgba(56, 189, 248, 0.4);
        }

        /* Result Area */
        .result-box {
            margin-top: 30px;
            text-align: center;
            display: none;
        }

        .result-box img {
            max-width: 100%;
            max-height: 500px;
            border-radius: 16px;
            border: 1px solid var(--border-glow);
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }

        .audio-player {
            width: 100%;
            margin-top: 15px;
        }

        .loader {
            display: none;
            color: var(--primary-glow);
            margin: 25px 0;
            text-align: center;
        }
    </style>
</head>
<body>

    <nav>
        <div class="logo">
            <i class="fa-solid fa-wand-magic-sparkles"></i> ابن العرب AI
        </div>
        <div class="nav-actions">
            <div class="credits-pill">⚡ النقاط: <span id="user-credits">5</span></div>
            <button class="btn-google" id="login-btn" onclick="loginGoogle()">
                <i class="fa-brands fa-google" style="color:#ea4335;"></i> تسجيل بـ Google
            </button>
            <div class="user-profile" id="user-profile">
                <img id="user-img" src="" alt="User">
                <button onclick="logout()" style="background:#ef4444; color:#fff; border:none; padding:6px 12px; border-radius:6px; cursor:pointer; font-weight:bold;">خروج</button>
            </div>
        </div>
    </nav>

    <div class="hero">
        <h1>إمكانيات الذكاء الاصطناعي بين <span>يديك الآن</span></h1>
        <p>ولد صوراً واقعية، حوّل النصوص إلى صوت ناطق، واكتب المحتوى بضغطة زر.</p>
    </div>

    <div class="container">
        <!-- أزرار التبديل بين الأدوات -->
        <div class="tools-nav">
            <button class="tab-btn active" onclick="switchTool('image', this)"><i class="fa-solid fa-image"></i> توليد الصور (FLUX)</button>
            <button class="tab-btn" onclick="switchTool('audio', this)"><i class="fa-solid fa-volume-high"></i> توليد الصوت الذكي</button>
            <button class="tab-btn" onclick="switchTool('writer', this)"><i class="fa-solid fa-pen-nib"></i> كتابة المحتوى</button>
        </div>

        <!-- منطقة العمل -->
        <div class="workspace">
            <h3 id="tool-title" style="margin-bottom: 10px;"><i class="fa-solid fa-image"></i> توليد صور فائقة الجودة</h3>
            <p id="tool-desc" style="color:var(--text-dim); font-size:0.9rem; margin-bottom:15px;">اكتب وصفك بالعربي وسيتم إنشاء صورة عالية الدقة فوراً:</p>

            <textarea id="user-prompt" placeholder="اكتب وصفك هنا... (مثال: أسد ملكي يرتدي درعاً ذهبياً فوق قمة جبل)"></textarea>

            <button class="btn-generate" id="action-btn" onclick="runTool()">
                <i class="fa-solid fa-bolt"></i> بدء التوليد الآن
            </button>

            <div class="loader" id="loader">
                <i class="fa-solid fa-circle-notch fa-spin fa-2x"></i>
                <p style="margin-top:10px;" id="loader-text">جاري المعالجة والتوليد السريع...</p>
            </div>

            <div class="result-box" id="result-box">
                <img id="out-img" src="" alt="النتيجة" style="display:none;">
                <div id="out-text" style="display:none; text-align:right; background:rgba(6,9,19,0.8); padding:20px; border-radius:12px; line-height:1.8;"></div>
            </div>
        </div>
    </div>

    <script>
        // بيانات Firebase الخاصة بك
        const firebaseConfig = {
            apiKey: "AIzaSyC2Dbppgjk09edIskPX5OM-ujoqKXLJRDA",
            authDomain: "abn-arab-ai.firebaseapp.com",
            projectId: "abn-arab-ai",
            storageBucket: "abn-arab-ai.firebasestorage.app",
            messagingSenderId: "863813080286",
            appId: "1:863813080286:web:5fd4e1d46380992fdede4f",
            measurementId: "G-XYNDV35VB2"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const provider = new firebase.auth.GoogleAuthProvider();

        let credits = localStorage.getItem('abn_credits') ? parseInt(localStorage.getItem('abn_credits')) : 5;
        document.getElementById('user-credits').innerText = credits;

        // Firebase Auth
        function loginGoogle() {
            auth.signInWithPopup(provider).catch(e => alert(e.message));
        }

        function logout() {
            auth.signOut().then(() => {
                document.getElementById('login-btn').style.display = 'flex';
                document.getElementById('user-profile').style.display = 'none';
            });
        }

        auth.onAuthStateChanged(user => {
            if (user) {
                document.getElementById('login-btn').style.display = 'none';
                document.getElementById('user-profile').style.display = 'flex';
                document.getElementById('user-img').src = user.photoURL;
            }
        });

        // Tab Switching
        let currentMode = 'image';
        function switchTool(mode, btn) {
            currentMode = mode;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            document.getElementById('result-box').style.display = 'none';

            if(mode === 'image') {
                document.getElementById('tool-title').innerHTML = '<i class="fa-solid fa-image"></i> توليد صور فائقة الجودة';
                document.getElementById('user-prompt').placeholder = 'اكتب وصف الصورة بالعربي...';
            } else if(mode === 'audio') {
                document.getElementById('tool-title').innerHTML = '<i class="fa-solid fa-volume-high"></i> تحويل النص إلى صوت ذكي';
                document.getElementById('user-prompt').placeholder = 'اكتب النص الذي تريد تحويله لمقطع صوتي ناطق...';
            } else {
                document.getElementById('tool-title').innerHTML = '<i class="fa-solid fa-pen-nib"></i> كتابة المحتوى والبوستات';
                document.getElementById('user-prompt').placeholder = 'اكتب عنوان المقال أو موضوع البوست المطلوب...';
            }
        }

        // Action Executions
        async function runTool() {
            if (credits <= 0) {
                alert("نفذت نقاطك المجانية الـ 5!");
                return;
            }

            const prompt = document.getElementById('user-prompt').value.trim();
            if(!prompt) return alert("اكتب النص أولاً!");

            const loader = document.getElementById('loader');
            const resBox = document.getElementById('result-box');
            const imgOut = document.getElementById('out-img');
            const textOut = document.getElementById('out-text');

            loader.style.display = 'block';
            resBox.style.display = 'none';

            if (currentMode === 'image') {
                // توليد الصور
                const trans = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=ar&tl=en&dt=t&q=${encodeURIComponent(prompt)}`);
                const transData = await trans.json();
                const enPrompt = transData[0][0][0];

                const imgUrl = `https://pollinations.ai/p/${encodeURIComponent(enPrompt)}?width=1024&height=1024&seed=${Math.floor(Math.random()*1000000)}&model=flux`;
                
                imgOut.src = imgUrl;
                imgOut.onload = () => {
                    loader.style.display = 'none';
                    resBox.style.display = 'block';
                    imgOut.style.display = 'block';
                    textOut.style.display = 'none';
                    useCredit();
                };
            } else if (currentMode === 'audio') {
                // توليد الصوت الناطق مباشرة
                loader.style.display = 'none';
                resBox.style.display = 'block';
                imgOut.style.display = 'none';
                textOut.style.display = 'block';
                
                textOut.innerHTML = `
                    <p style="margin-bottom:10px;">🔊 <strong>جاري قراءة النص بصوت واضح:</strong></p>
                    <p style="color:var(--primary-glow);">${prompt}</p>
                `;
                
                const utterance = new SpeechSynthesisUtterance(prompt);
                utterance.lang = 'ar-SA';
                window.speechSynthesis.speak(utterance);
                useCredit();
            } else {
                // كتابة محتوى
                setTimeout(() => {
                    loader.style.display = 'none';
                    resBox.style.display = 'block';
                    imgOut.style.display = 'none';
                    textOut.style.display = 'block';
                    textOut.innerHTML = `<h3>📝 محتوى منشأ حول: ${prompt}</h3><p style="margin-top:10px;">هذا النص تم توليده بناءً على طلبك بالذكاء الاصطناعي بشكل دقيق وجاهز للنشر.</p>`;
                    useCredit();
                }, 1200);
            }
        }

        function useCredit() {
            credits--;
            localStorage.setItem('abn_credits', credits);
            document.getElementById('user-credits').innerText = credits;
        }
    </script>
</body>
</html>
