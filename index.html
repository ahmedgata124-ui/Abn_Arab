<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ابن العرب AI - تجربة حقيقية</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>

    <style>
        :root {
            --bg: #090d16;
            --card: #131b2e;
            --primary: #38bdf8;
            --text: #f8fafc;
            --muted: #94a3b8;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Tajawal', sans-serif;
            margin: 0;
            padding: 20px;
            direction: rtl;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1000px;
            margin: 0 auto 30px;
            padding: 15px;
            background: var(--card);
            border-radius: 12px;
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .user-profile img {
            width: 40px;
            height: 40px;
            border-radius: 50%;
        }

        .btn {
            background: var(--primary);
            color: #000;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: var(--card);
            padding: 25px;
            border-radius: 16px;
        }

        textarea {
            width: 100%;
            height: 90px;
            background: var(--bg);
            border: 1px solid #1e293b;
            color: #fff;
            padding: 12px;
            border-radius: 8px;
            font-size: 1rem;
            box-sizing: border-box;
            margin-bottom: 15px;
            resize: none;
        }

        .result-box {
            margin-top: 25px;
            text-align: center;
        }

        .result-box img {
            max-width: 100%;
            border-radius: 12px;
            display: none;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }

        .loader {
            display: none;
            color: var(--primary);
            font-size: 1.2rem;
            margin: 15px 0;
        }
    </style>
</head>
<body>

    <header>
        <h2 style="margin:0; color:var(--primary);"><i class="fa-solid fa-wand-magic-sparkles"></i> ابن العرب AI</h2>
        
        <!-- زر وتسجيل حساب جوجل -->
        <div id="auth-container">
            <button class="btn" id="login-btn" onclick="loginWithGoogle()">
                <i class="fa-brands fa-google"></i> تسجيل بحساب Google
            </button>
            <div class="user-profile" id="user-info" style="display: none;">
                <img id="user-img" src="" alt="User">
                <div>
                    <strong id="user-name" style="display:block; font-size:0.9rem;"></strong>
                    <small style="color:var(--primary); font-size:0.8rem;">نقاطك: <span id="user-points">100</span></small>
                </div>
                <button class="btn" onclick="logout()" style="padding: 5px 10px; font-size: 0.8rem; background: #ef4444; color: #fff;">خروج</button>
            </div>
        </div>
    </header>

    <div class="container">
        <h3><i class="fa-solid fa-image"></i> توليد صور حقيقية بالذكاء الاصطناعي</h3>
        <p style="color: var(--muted); font-size: 0.9rem;">اكتب وصفك بالعربي وسيتم ترجمته وتوليد الصورة بجد فوراً:</p>

        <textarea id="prompt-input" placeholder="مثال: أسد يرتدي تاجاً ملكياً في صحراء تحت أضواء النيون"></textarea>
        
        <button class="btn" style="width: 100%; justify-content: center; font-size: 1.1rem;" onclick="generateRealImage()">
            <i class="fa-solid fa-bolt"></i> توليد الصورة الآن
        </button>

        <div class="result-box">
            <div class="loader" id="loader"><i class="fa-solid fa-spinner fa-spin"></i> جاري ترجمة النص وتوليد الصورة الحقيقية...</div>
            <img id="output-image" src="" alt="الصورة المتولدة">
        </div>
    </div>

    <script>
        // 1. إعدادات Firebase (ضع بيانات مشروؤك من Firebase Console هنا)
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT_ID.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        // تهيئة Firebase
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const auth = firebase.auth();
        const provider = new firebase.auth.GoogleAuthProvider();

        // تسجيل الدخول بجوجل
        function loginWithGoogle() {
            auth.signInWithPopup(provider).then(result => {
                const user = result.user;
                showUserProfile(user);
            }).catch(error => {
                alert("حدث خطأ في التسجيل: " + error.message);
            });
        }

        // تسجيل الخروج
        function logout() {
            auth.signOut().then(() => {
                document.getElementById('login-btn').style.display = 'flex';
                document.getElementById('user-info').style.display = 'none';
            });
        }

        // متابعة حالة المستخدم
        auth.onAuthStateChanged(user => {
            if (user) {
                showUserProfile(user);
            }
        });

        function showUserProfile(user) {
            document.getElementById('login-btn').style.display = 'none';
            document.getElementById('user-info').style.display = 'flex';
            document.getElementById('user-img').src = user.photoURL;
            document.getElementById('user-name').innerText = user.displayName;
        }

        // 2. توليد الصور الحقيقي عبر Pollinations AI + Google Translate API
        async function generateRealImage() {
            const prompt = document.getElementById('prompt-input').value.trim();
            if (!prompt) {
                alert("اكتب وصف الصورة أولاً!");
                return;
            }

            const loader = document.getElementById('loader');
            const img = document.getElementById('output-image');

            loader.style.display = 'block';
            img.style.display = 'none';

            try {
                // ترجمة الوصف من العربي للإنجليزي تلقائياً لنتائج دقيقة
                const transRes = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=ar&tl=en&dt=t&q=${encodeURIComponent(prompt)}`);
                const transData = await transRes.json();
                const translatedPrompt = transData[0][0][0];

                // توليد رابط الصورة الحقيقي من محرك الذكاء الاصطناعي
                const imageUrl = `https://pollinations.ai/p/${encodeURIComponent(translatedPrompt)}?width=1024&height=1024&seed=${Math.floor(Math.random()*1000000)}&model=flux`;

                // تحميل الصورة
                img.src = imageUrl;
                img.onload = () => {
                    loader.style.display = 'none';
                    img.style.display = 'block';
                };
            } catch (err) {
                loader.style.display = 'none';
                alert("حدث خطأ أثناء توليد الصورة، حاول مرة أخرى.");
            }
        }
    </script>
</body>
</html>
